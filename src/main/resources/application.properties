spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventos}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=50

server.port=${PORT:8080}

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=10MB

app.cloudinary.url=${CLOUDINARY_URL:}
app.imagenes.prefijo-permitido=${IMAGENES_PREFIJO:https://res.cloudinary.com/}

server.error.include-message=always

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
